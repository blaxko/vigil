[toolchain]
anchor_version = "1.2.0"

[features]
resolution = true
skip-lint = false

[programs.localnet]
regime_oracle = "7PHoqxS9CQxy6vTmDCEqkmB1oNCeCotxFSPg3rKmDQUV"
lending_market = "nKD282jg8NPnVLv5hhPrRk8XRfkan8xj73KP6fNTK5K"
mock_pyth = "BA6ND81qDqr1spCJsdkQk92Q7wzanvLYBRijSiY9h7Xw"

[programs.devnet]
regime_oracle = "7PHoqxS9CQxy6vTmDCEqkmB1oNCeCotxFSPg3rKmDQUV"
lending_market = "nKD282jg8NPnVLv5hhPrRk8XRfkan8xj73KP6fNTK5K"
mock_pyth = "BA6ND81qDqr1spCJsdkQk92Q7wzanvLYBRijSiY9h7Xw"

[registry]
url = "https://api.apr.dev"

[provider]
cluster = "devnet"
wallet = "~/.config/solana/id.json"

[scripts]
# Invoked directly rather than via `npx ts-mocha`: under this WSL setup,
# npx's binary resolution for `ts-mocha` ends up shelling out through
# cmd.exe (visible as "'ts-mocha' is not recognized..." even though a
# plain `npx --version` works fine) when spawned as an Anchor.toml
# [scripts] child process. The local node_modules/.bin/ts-mocha script
# itself is a normal Linux shebang script and runs correctly when invoked
# by its real path, so we skip npx's resolution entirely.
test = "node_modules/.bin/ts-mocha -p ./tsconfig.json -t 1000000 tests/**/*.ts"
