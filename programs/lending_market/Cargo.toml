[package]
name = "lending_market"
version = "0.1.0"
description = "Vigil isolated lending market: deposit tokenized equity, borrow USDC against regime-aware prices"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "lending_market"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build", "regime_oracle/idl-build"]
default = []

[dependencies]
anchor-lang = { version = "1.2.0", features = ["init-if-needed"] }
anchor-spl = { version = "1.2.0", features = ["token_2022", "token_2022_extensions"] }
spl-token-2022 = { version = "11.0.0", features = ["no-entrypoint"] }
regime_oracle = { path = "../regime_oracle", features = ["cpi"] }

[dev-dependencies]
proptest = "1.4"
